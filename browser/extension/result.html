<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>OpenTranslator</title>
  <style>
    :root {
      color-scheme: light dark;
      --ot-accent: #007aff;
      --ot-bg: #ffffff;
      --ot-label: rgba(0, 0, 0, 0.85);
      --ot-label-2: rgba(0, 0, 0, 0.5);
      --ot-fill: rgba(120, 120, 128, 0.12);
      --ot-fill-hover: rgba(120, 120, 128, 0.2);
      --ot-red: #d70015;
      --ot-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei UI", system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ot-accent: #0a84ff;
        --ot-bg: #1c1c1e;
        --ot-label: rgba(255, 255, 255, 0.85);
        --ot-label-2: rgba(255, 255, 255, 0.55);
        --ot-fill: rgba(120, 120, 128, 0.24);
        --ot-fill-hover: rgba(120, 120, 128, 0.36);
        --ot-red: #ff453a;
      }
    }
    body { font-family: var(--ot-font); font-size: 14px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; margin: 16px; color: var(--ot-label);
      background: var(--ot-bg); }
    h1 { font-size: 15px; font-weight: 600; margin: 0 0 8px; }
    #original { color: var(--ot-label-2); white-space: pre-wrap; word-break: break-word;
      max-height: 96px; overflow: auto; margin: 0 0 10px;
      scrollbar-width: thin; scrollbar-color: rgba(120,120,128,.4) transparent; }
    #status { white-space: pre-wrap; word-break: break-word; min-height: 1.5em; }
    #status.error { color: var(--ot-red); }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { font: inherit; font-size: 13px; padding: 5px 12px; min-height: 28px;
      cursor: pointer; color: var(--ot-label); background: var(--ot-fill);
      border: 0; border-radius: 8px; transition: background-color .15s ease; }
    button:hover:not(:disabled) { background: var(--ot-fill-hover); }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 2px solid var(--ot-accent); outline-offset: 1px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(120,120,128,.4); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <h1>OpenTranslator</h1>
  <p id="original"></p>
  <div id="status">翻译中…</div>
  <div class="row">
    <button type="button" id="copy" disabled>复制译文</button>
    <button type="button" id="close">关闭</button>
  </div>
  <script src="result.js"></script>
</body>
</html>
