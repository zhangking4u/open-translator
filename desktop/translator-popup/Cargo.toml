[package]
name = "translator-popup"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = "0.11.5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "time"] }
