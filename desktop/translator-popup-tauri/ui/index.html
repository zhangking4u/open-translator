<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTranslator</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="titlebar" data-tauri-drag-region>
        <span class="dot" id="dot"></span>
        <span class="title" id="title" data-tauri-drag-region>OpenTranslator</span>
        <span class="spacer" data-tauri-drag-region></span>
        <button id="open-history" class="icon" title="历史（Ctrl+H）" aria-label="历史">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
        </button>
        <button id="open-settings" class="icon" title="设置（Ctrl+,）" aria-label="设置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button id="pin" class="icon" title="固定窗口（保持最前）" aria-label="固定窗口">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
          </svg>
        </button>
        <button id="close" class="icon" title="隐藏（Esc）" aria-label="隐藏">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </header>

      <div id="translator-view">
        <div class="language-row">
          <select id="source-select" title="源语言"></select>
          <button id="swap" class="icon" title="交换语言（译文变为新原文）" aria-label="交换语言">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m8 3-4 4 4 4" />
              <path d="M4 7h16" />
              <path d="m16 21 4-4-4-4" />
              <path d="M20 17H4" />
            </svg>
          </button>
          <select id="target-select" title="目标语言"></select>
          <span id="detected" class="dim-text"></span>
        </div>

        <section id="source" class="source" hidden></section>

        <section id="translation" class="translation">
          <div class="empty-state">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 5h9" />
              <path d="M4 9h6" />
              <path d="M4 13h4" />
              <path d="m13 11 7 3-3 1-1 3z" />
            </svg>
            <p class="hint">等待划词</p>
            <p class="sub">按 Ctrl+Alt+T 翻译选中文本</p>
          </div>
        </section>

        <footer class="footer">
          <span id="status" class="status"></span>
          <span class="spacer"></span>
          <button id="speak" class="icon" hidden title="朗读译文" aria-label="朗读译文">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M11 5 6 9H2v6h4l5 4z" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
          </button>
          <button id="replace" class="icon" hidden title="替换原文" aria-label="替换原文">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4c0-1.1.9-2 2-2" />
              <path d="M20 2c1.1 0 2 .9 2 2" />
              <path d="M22 8c0 1.1-.9 2-2 2" />
              <path d="M16 10c-1.1 0-2-.9-2-2" />
              <path d="m3 7 3 3 3-3" />
              <path d="M6 10V5c0-1.7 1.3-3 3-3h1" />
              <rect width="8" height="8" x="2" y="14" rx="2" />
            </svg>
          </button>
          <button id="retranslate" class="icon" hidden title="重新翻译（Ctrl+Enter）" aria-label="重新翻译">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
          </button>
          <button id="copy" class="primary" disabled title="复制译文（Ctrl+Shift+C）" aria-label="复制译文">
            <svg class="icon-copy" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="14" height="14" x="8" y="8" rx="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span>复制</span>
          </button>
        </footer>
      </div>

      <div id="settings-view" hidden>
        <div class="page-head">
          <span class="page-title">设置</span>
          <span class="spacer"></span>
          <button id="settings-back">完成</button>
        </div>

        <p class="group-title">翻译</p>
        <div class="group" id="selection-group">
          <div class="setting-row">
            <span class="setting-name">选中文字后</span>
            <div class="setting-control">
              <select id="selection-mode" class="setting-select" title="选中文字后">
                <option value="off" title="选中文字后不自动翻译；仍可按快捷键翻译。">不自动翻译</option>
                <option value="ball" title="选中文字后，把鼠标移到悬浮球上悬停即可翻译。">悬浮球翻译</option>
                <option value="auto" title="选中文字后立即翻译。">立即翻译</option>
              </select>
              <span id="selection-saved" class="ok-text" hidden>已保存</span>
            </div>
          </div>
          <div class="setting-row">
            <span class="setting-name">按快捷键翻译</span>
            <div class="setting-control">
              <button
                id="hotkey-recorder"
                class="hotkey-recorder"
                type="button"
                aria-label="录制快捷键"
                title="选中文字后按下此快捷键即可翻译。点击可重新录制：按下新组合键并再次确认即可应用，Esc 取消；需要 Ctrl/Alt/Super；被占用时保留原快捷键。"
              ></button>
              <button
                id="hotkey-reset"
                hidden
                title="恢复默认快捷键 Ctrl+Alt+T"
              >
                恢复默认
              </button>
              <span id="hotkey-saved" class="ok-text" hidden>已应用</span>
              <span id="hotkey-error" class="error-text" hidden></span>
            </div>
          </div>
        </div>

        <p class="group-title">常规</p>
        <div class="group">
          <label class="setting-row switch-row">
            <span class="setting-name">检查更新</span>
            <input
              type="checkbox"
              id="switch-updates"
              class="switch"
              role="switch"
              aria-checked="false"
            />
          </label>
          <label class="setting-row switch-row">
            <span class="setting-name">浏览器扩展服务</span>
            <input
              type="checkbox"
              id="switch-extension"
              class="switch"
              role="switch"
              aria-checked="false"
            />
          </label>
        </div>

        <button
          id="about-toggle"
          class="group-title group-title-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="about-version-row about-model-row open-config"
          title="展开或收起关于信息"
        >
          关于
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6.25 8 10.25 12 6.25" />
          </svg>
        </button>
        <div class="group" id="about-group">
          <div class="setting-row" id="about-version-row" hidden>
            <span class="setting-name"><span id="app-version" class="update-version"></span></span>
            <div class="setting-control">
              <button id="update-notes" hidden>更新说明</button>
              <button id="update-check">检查更新</button>
              <button id="update-action" class="primary" hidden>更新</button>
            </div>
          </div>
          <p id="update-status" class="update-status" hidden></p>
          <progress id="update-progress" max="100" value="0" hidden></progress>
          <div class="setting-row" id="about-model-row" hidden>
            <span class="setting-name">模型文件</span>
            <div class="setting-control">
              <input
                id="model-input"
                class="text-input"
                placeholder="本地 .gguf 文件路径"
                spellcheck="false"
              />
              <button
                id="open-model"
                class="icon-button"
                type="button"
                title="打开模型文件所在位置"
                aria-label="打开模型文件所在位置"
              >
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2h9A1.5 1.5 0 0 1 21 9.5v8A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" />
                </svg>
              </button>
              <button id="model-reset" hidden title="使用默认模型位置">使用默认</button>
              <span id="model-saved" class="ok-text" hidden>已保存</span>
            </div>
          </div>
          <button id="open-config" class="setting-row nav-row" type="button" hidden>
            <span class="setting-name">配置目录</span>
            <span class="nav-value">
              <span id="config-path" class="dim-text path-text"></span>
              <svg
                class="nav-chevron"
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9 6 6 6-6 6" />
              </svg>
            </span>
          </button>
        </div>
      </div>

      <div id="history-view" hidden>
        <div class="page-head">
          <span class="page-title">最近翻译</span>
          <span class="spacer"></span>
          <button id="history-back">完成</button>
        </div>
        <div class="group">
          <div id="history-list" class="history-list"></div>
          <div id="history-empty" class="history-empty" hidden>
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            <p>暂无翻译记录</p>
            <p class="sub" id="history-empty-hint">选中文字按 Ctrl+Alt+T 开始</p>
          </div>
          <button id="history-clear" class="setting-row danger-row" type="button" hidden>
            清空历史
          </button>
        </div>
      </div>

      <div id="context-menu" class="context-menu" hidden>
        <button data-action="copy" type="button">复制</button>
        <button data-action="select-all" type="button">全选</button>
        <button data-action="speak" type="button">朗读</button>
      </div>

      <div id="confirm-dialog" class="confirm-backdrop" hidden>
        <div
          class="confirm-card"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="confirm-title"
          aria-describedby="confirm-body"
        >
          <p id="confirm-title" class="confirm-title">清空历史？</p>
          <p id="confirm-body" class="confirm-body">此操作无法撤销。</p>
          <div class="confirm-actions">
            <button id="confirm-cancel" type="button">取消</button>
            <button id="confirm-accept" class="destructive" type="button">清空</button>
          </div>
        </div>
      </div>
    </main>
    <script src="dropdown.js"></script>
    <script src="segmented.js"></script>
    <script src="main.js"></script>
  </body>
</html>
