<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenTranslator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header class="titlebar" data-tauri-drag-region>
        <span class="dot" id="dot"></span>
        <span class="title" id="title" data-tauri-drag-region>OpenTranslator</span>
        <span class="spacer" data-tauri-drag-region></span>
        <button id="open-history" class="icon" title="历史（Ctrl+H）" aria-label="历史">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M12 7v5l4 2" />
          </svg>
        </button>
        <button id="pin" class="icon" title="固定窗口（保持最前）" aria-label="固定窗口">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 17v5" />
            <path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z" />
          </svg>
        </button>
        <button id="close" class="icon" title="隐藏（Esc）" aria-label="隐藏">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </header>

      <div id="translator-view">
        <div class="language-row">
          <select id="source-select" title="源语言"></select>
          <button id="swap" class="icon" title="交换语言（译文变为新原文）" aria-label="交换语言">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m8 3-4 4 4 4" />
              <path d="M4 7h16" />
              <path d="m16 21 4-4-4-4" />
              <path d="M20 17H4" />
            </svg>
          </button>
          <select id="target-select" title="目标语言"></select>
          <span id="detected" class="dim-text"></span>
        </div>

        <section id="source" class="source" hidden></section>

        <section id="translation" class="translation">
          <div class="empty-state">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M3 12h18" />
              <path d="M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z" />
            </svg>
            <p class="hint">等待划词</p>
            <p class="sub">按 Ctrl+Alt+T 翻译选中文本</p>
          </div>
        </section>

        <footer class="footer">
          <span id="status" class="status"></span>
          <span class="spacer"></span>
          <button id="replace" class="icon" hidden title="替换原文" aria-label="替换原文">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 4c0-1.1.9-2 2-2" />
              <path d="M20 2c1.1 0 2 .9 2 2" />
              <path d="M22 8c0 1.1-.9 2-2 2" />
              <path d="M16 10c-1.1 0-2-.9-2-2" />
              <path d="m3 7 3 3 3-3" />
              <path d="M6 10V5c0-1.7 1.3-3 3-3h1" />
              <rect width="8" height="8" x="2" y="14" rx="2" />
            </svg>
          </button>
          <button id="retranslate" class="icon" hidden title="重新翻译（Ctrl+Enter）" aria-label="重新翻译">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
          </button>
          <button id="copy" class="primary" disabled title="复制译文（Ctrl+Shift+C）" aria-label="复制译文">
            <svg class="icon-copy" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect width="14" height="14" x="8" y="8" rx="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 6 9 17l-5-5" />
            </svg>
            <span>复制</span>
          </button>
        </footer>
      </div>

      <div id="settings-view" hidden>
        <div class="page-head">
          <span class="page-title">设置</span>
          <span class="spacer"></span>
          <button id="settings-back">完成</button>
        </div>

        <p class="group-title">常规</p>
        <div class="group">
          <div class="setting-row">
            <span class="setting-name">
              快捷键
              <span
                class="info"
                role="img"
                title="点击后按下新组合键并再次确认即可应用，Esc 取消；需要 Ctrl/Alt/Super；被占用时保留原快捷键。"
                aria-label="点击后按下新组合键并再次确认即可应用，Esc 取消；需要 Ctrl/Alt/Super；被占用时保留原快捷键。"
                >i</span
              >
            </span>
            <div class="setting-control">
              <button
                id="hotkey-recorder"
                class="hotkey-recorder"
                type="button"
                aria-label="录制快捷键"
              ></button>
              <button
                id="hotkey-reset"
                hidden
                title="恢复默认快捷键 Ctrl+Alt+T"
              >
                恢复默认
              </button>
              <span id="hotkey-saved" class="ok-text" hidden>已应用</span>
              <span id="hotkey-error" class="error-text" hidden></span>
            </div>
          </div>
        </div>

        <p class="group-title">模型</p>
        <div class="group">
          <div class="setting-row">
            <span class="setting-name">
              模型路径
              <span
                class="info"
                role="img"
                title="目标文件不存在且开启自动下载时，会下载默认模型到该路径。"
                aria-label="目标文件不存在且开启自动下载时，会下载默认模型到该路径。"
                >i</span
              >
            </span>
            <div class="setting-control">
              <input
                id="model-input"
                class="text-input"
                placeholder="留空使用默认位置"
                spellcheck="false"
              />
              <span id="model-saved" class="ok-text" hidden>已保存</span>
            </div>
          </div>
          <label class="setting-row switch-row">
            <span class="setting-name">自动下载模型</span>
            <input
              type="checkbox"
              id="switch-auto"
              class="switch"
              role="switch"
              aria-checked="false"
            />
          </label>
        </div>
        <p class="group-note">模型文件（.gguf）的完整路径；留空使用默认位置，修改后下次启动生效。</p>

        <p class="group-title">服务</p>
        <div class="group">
          <label class="setting-row switch-row">
            <span class="setting-name">提供浏览器扩展接口</span>
            <input
              type="checkbox"
              id="switch-extension"
              class="switch"
              role="switch"
              aria-checked="false"
            />
          </label>
          <button id="open-config" class="setting-row nav-row" type="button">
            <span class="setting-name">配置目录</span>
            <span class="nav-value">
              <span id="config-path" class="dim-text path-text"></span>
              <svg
                class="nav-chevron"
                viewBox="0 0 24 24"
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m9 6 6 6-6 6" />
              </svg>
            </span>
          </button>
        </div>

        <p class="group-title">更新</p>
        <div class="group">
          <label class="setting-row switch-row">
            <span class="setting-name">启动时检查更新</span>
            <input
              type="checkbox"
              id="switch-updates"
              class="switch"
              role="switch"
              aria-checked="false"
            />
          </label>
          <div class="setting-row">
            <span class="setting-name"><span id="app-version" class="update-version"></span></span>
            <div class="setting-control">
              <button id="update-notes" hidden>更新说明</button>
              <button id="update-check">检查更新</button>
              <button id="update-action" class="primary" hidden>更新</button>
            </div>
          </div>
          <p id="update-status" class="update-status" hidden></p>
          <progress id="update-progress" max="100" value="0" hidden></progress>
        </div>
      </div>

      <div id="history-view" hidden>
        <div class="page-head">
          <span class="page-title">最近翻译</span>
          <span class="spacer"></span>
          <button id="history-back">完成</button>
        </div>
        <div class="group">
          <div id="history-list" class="history-list"></div>
          <div id="history-empty" class="history-empty" hidden>
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
            <p>暂无翻译记录</p>
            <p class="sub">选中文字按 Ctrl+Alt+T 开始</p>
          </div>
          <button id="history-clear" class="setting-row danger-row" type="button" hidden>
            清空历史
          </button>
        </div>
      </div>

      <div id="confirm-dialog" class="confirm-backdrop" hidden>
        <div
          class="confirm-card"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="confirm-title"
          aria-describedby="confirm-body"
        >
          <p id="confirm-title" class="confirm-title">清空历史？</p>
          <p id="confirm-body" class="confirm-body">此操作无法撤销。</p>
          <div class="confirm-actions">
            <button id="confirm-cancel" type="button">取消</button>
            <button id="confirm-accept" class="destructive" type="button">清空</button>
          </div>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
