[package]
name = "translator-popup-tauri"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.6.1"
axum = "0.8"
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "time"] }
translator-core = { version = "0.1.0", path = "../translator-core" }
translator-service = { version = "0.1.0", path = "../../core/translator-service" }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.8.1"
windows-sys = { version = "0.59", features = [
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
