[package]
name = "translator-popup-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
translator-core = { version = "0.1.0", path = "../translator-core" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = "3.6.1"
enigo = "0.6.1"
global-hotkey = "0.8.0"
tray-icon = "0.26.0"
