[package]
name = "translator-popup-desktop"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
eframe = "0.36.2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "time"] }
translator-core = { version = "0.1.0", path = "../translator-core" }
translator-service = { version = "0.1.0", path = "../../core/translator-service" }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
arboard = "3.6.1"
enigo = "0.6.1"
global-hotkey = "0.8.0"
tray-icon = "0.26.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
