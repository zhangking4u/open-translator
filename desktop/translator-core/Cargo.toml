[package]
name = "translator-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bzip2 = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tar = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
whatlang = "0.18"

[dev-dependencies]
axum = "0.8.9"
