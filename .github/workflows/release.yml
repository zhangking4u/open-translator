name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/translator-popup-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Rebuild the sherpa-onnx prebuilt libraries
        # rust-cache restores sherpa-onnx-sys fingerprints without the
        # extracted lib directory, so cargo skips the build script. Remove its
        # build outputs so the script downloads and extracts again.
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force target/*/build/sherpa-onnx-sys-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force target/*/.fingerprint/sherpa-onnx-sys-* -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force target/sherpa-onnx-prebuilt -ErrorAction SilentlyContinue
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release
      - name: Bundle ONNX Runtime (OCR)
        # Pinned runtime for screenshot OCR; the client loads it from the
        # directory next to the executable.
        shell: pwsh
        env:
          ORT_VERSION: "1.28.2"
          ORT_SHA256: "c4eedd29489d5feca21866d054638416f3655bf6b18851b3b6b85c8313e95c35"
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          $archive = "onnxruntime-win-x64-$env:ORT_VERSION.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$archive"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:ORT_SHA256) { throw "ONNX Runtime SHA-256 mismatch: $hash" }
          Expand-Archive -Path $archive -DestinationPath ort
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "ort\onnxruntime-win-x64-$env:ORT_VERSION\lib\onnxruntime.dll" package\
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/translator-popup-tauri.exe package/
          Copy-Item target/release/*.dll package/
          if (-not (Test-Path package/onnxruntime.dll)) { throw "onnxruntime.dll missing from the build output" }
          Copy-Item ../../packaging/windows/install.ps1 package/
          Copy-Item ../../packaging/windows/README.txt package/
          Compress-Archive -Path package/* -DestinationPath OpenTranslator-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-windows-x64
          path: desktop/translator-popup-tauri/OpenTranslator-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --generate-notes *> $null }
          gh release upload "${{ github.ref_name }}" "OpenTranslator-windows-x64.zip" --clobber

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Rebuild the sherpa-onnx prebuilt libraries
        # rust-cache restores sherpa-onnx-sys fingerprints without the
        # extracted lib directory, so cargo skips the build script. Remove its
        # build outputs so the script downloads and extracts again.
        run: |
          rm -rf desktop/translator-popup-tauri/target/*/build/sherpa-onnx-sys-*
          rm -rf desktop/translator-popup-tauri/target/*/.fingerprint/sherpa-onnx-sys-*
          rm -rf desktop/translator-popup-tauri/target/sherpa-onnx-prebuilt
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release --manifest-path desktop/translator-popup-tauri/Cargo.toml
      - name: Package deb
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0+$(git rev-parse --short=7 HEAD)"
          fi
          packaging/linux/make-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-linux-x64
          path: packaging/linux/build/OpenTranslator-linux-*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" packaging/linux/build/OpenTranslator-linux-*.deb --clobber

  macos:
    name: macOS package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/translator-popup-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release
      - name: Bundle ONNX Runtime (OCR)
        # Pinned runtime for screenshot OCR; the client loads it from the
        # directory next to the binary inside the app bundle. 1.28.2 ships an
        # arm64 macOS build only, matching the arm64 runner artifact.
        env:
          ORT_VERSION: "1.28.2"
          ORT_SHA256: "c4fceacfc53765d0869dc9180c31ec91054d149017a99d1e80ffe28dc79596de"
        run: |
          set -euo pipefail
          ARCH="$(uname -m)"
          archive="onnxruntime-osx-$ARCH-$ORT_VERSION.tgz"
          curl -L -o "$archive" "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$archive"
          echo "$ORT_SHA256  $archive" | shasum -a 256 -c -
          tar -xzf "$archive"
          for dylib in onnxruntime-osx-$ARCH-$ORT_VERSION/lib/libonnxruntime.*.dylib; do
            echo "ORT_DYLIB=$PWD/$dylib" >> "$GITHUB_ENV"
            break
          done
      - name: Package dmg
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ARCH="$(uname -m)"
          VERSION="${VERSION#v}"
          ../../packaging/macos/make-dmg.sh target/release/translator-popup-tauri "OpenTranslator-macos-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-macos
          path: desktop/translator-popup-tauri/OpenTranslator-macos-*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" OpenTranslator-macos-*.dmg --clobber

  browser-extension:
    name: Browser extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build zips
        run: bash browser/build.sh all --zip
      - name: Rename assets
        run: |
          mkdir -p browser-assets
          cp "$(ls browser/dist/open-translator-chrome-*.zip)" browser-assets/OpenTranslator-browser-chrome.zip
          cp "$(ls browser/dist/open-translator-firefox-*.zip)" browser-assets/OpenTranslator-browser-firefox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-browser
          path: browser-assets/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" browser-assets/OpenTranslator-browser-chrome.zip browser-assets/OpenTranslator-browser-firefox.zip --clobber
