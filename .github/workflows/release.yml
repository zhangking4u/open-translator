name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/translator-popup-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item target/release/translator-popup-tauri.exe package/
          Copy-Item ../../packaging/windows/install.ps1 package/
          Copy-Item ../../packaging/windows/README.txt package/
          Compress-Archive -Path package/* -DestinationPath OpenTranslator-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-windows-x64
          path: desktop/translator-popup-tauri/OpenTranslator-windows-x64.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -ne 0) { gh release create "${{ github.ref_name }}" --generate-notes *> $null }
          gh release upload "${{ github.ref_name }}" "OpenTranslator-windows-x64.zip" --clobber

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Heal an incomplete sherpa-onnx prebuilt cache
        run: |
          if ! ls desktop/translator-popup-tauri/target/sherpa-onnx-prebuilt/*/lib/libsherpa-onnx-c-api.so >/dev/null 2>&1; then
            rm -rf desktop/translator-popup-tauri/target/sherpa-onnx-prebuilt
          fi
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release --manifest-path desktop/translator-popup-tauri/Cargo.toml
      - name: Package deb
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0+$(git rev-parse --short=7 HEAD)"
          fi
          packaging/linux/make-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-linux-x64
          path: packaging/linux/build/OpenTranslator-linux-*.deb
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" packaging/linux/build/OpenTranslator-linux-*.deb --clobber

  macos:
    name: macOS package
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop/translator-popup-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - name: Build
        env:
          OPEN_TRANSLATOR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release
      - name: Package dmg
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          ARCH="$(uname -m)"
          VERSION="${VERSION#v}"
          ../../packaging/macos/make-dmg.sh target/release/translator-popup-tauri "OpenTranslator-macos-$ARCH.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-macos
          path: desktop/translator-popup-tauri/OpenTranslator-macos-*.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" OpenTranslator-macos-*.dmg --clobber

  browser-extension:
    name: Browser extension package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build zips
        run: bash browser/build.sh all --zip
      - name: Rename assets
        run: |
          mkdir -p browser-assets
          cp "$(ls browser/dist/open-translator-chrome-*.zip)" browser-assets/OpenTranslator-browser-chrome.zip
          cp "$(ls browser/dist/open-translator-firefox-*.zip)" browser-assets/OpenTranslator-browser-firefox.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTranslator-browser
          path: browser-assets/*.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" browser-assets/OpenTranslator-browser-chrome.zip browser-assets/OpenTranslator-browser-firefox.zip --clobber
