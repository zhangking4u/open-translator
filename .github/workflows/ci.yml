name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/translator-service
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/translator-service
      - run: cargo test

  inference:
    name: Inference crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/inference
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/inference
      - run: cargo test

  core-windows:
    name: Core service tests (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: core/translator-service
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/translator-service
      - run: cargo test

  desktop-core:
    name: Desktop core lib (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/translator-core
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-core
      - run: cargo test

  tauri:
    name: Tauri client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/translator-popup-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/translator-popup-tauri
      - run: cargo test --release

  tauri-frontend:
    name: Tauri frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Static checks
        run: |
          python3 -m json.tool desktop/translator-popup-tauri/tauri.conf.json > /dev/null
          for file in desktop/translator-popup-tauri/capabilities/*.json; do
            python3 -m json.tool "$file" > /dev/null
          done
          for file in desktop/translator-popup-tauri/ui/*.js; do
            node --check "$file"
          done

  browser:
    name: Browser extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Static checks and build
        run: |
          python3 -m json.tool browser/extension/manifest.json > /dev/null
          python3 -m json.tool browser/extension/manifest.chrome.json > /dev/null
          for file in browser/extension/*.js; do node --check "$file"; done
          ./browser/build.sh all
      - name: web-ext lint
        run: npx --yes web-ext lint --source-dir browser/dist/firefox

  browser-e2e:
    name: Chrome e2e smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/translator-service
      - run: ./browser/test.sh
